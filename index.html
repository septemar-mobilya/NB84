<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f3;--ink:#10252e;--mute:#5b707a;--acc:#0a6c8a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a20;--ink:#e6eef0;--mute:#8aa0a8;--acc:#4cc2e0}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 18px;display:flex;align-items:center;gap:14px}
#logo{height:44px;width:auto;max-width:140px;object-fit:contain}
h1{font-size:1.1rem;margin:0;word-break:break-word}
p{margin:2px 0 0;color:var(--mute);font-size:.88rem}
model-viewer{flex:1;width:100%;min-height:0;--progress-bar-color:var(--acc)}
#ar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--acc);color:#fff;border:0;border-radius:4px;padding:14px 26px;font:600 1rem inherit;font-family:inherit}
@media (prefers-color-scheme:dark){#ar{color:#07151a}}
#err{display:none;padding:24px 18px}
model-viewer{min-height:50vh}
#qr{display:flex;gap:16px;align-items:center;padding:14px 18px;flex-wrap:wrap}
#qc{background:#fff;border-radius:4px}
#qr button{font:600 .9rem inherit;font-family:inherit;padding:10px 16px;border:0;border-radius:4px;background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){#qr button{color:#07151a}}
#noar{margin:0;padding:0 18px 10px}
</style>
</head>
<body>
<header><img id="logo" src="logo.png" alt="Logo" onerror="this.remove()"><div><h1 id="t">Model yükleniyor...</h1><p>Döndürmek için sürükle, yakınlaştırmak için iki parmakla çek.</p></div></header>
<div id="err">Model bulunamadı. Adres şu biçimde olmalı: <code>?m=dosya-adi.glb</code></div>
<model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="1" environment-image="neutral"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" alt="3D model">
  <button id="ar" slot="ar-button">Odanda gör (AR)</button>
</model-viewer>
<p id="noar" hidden>AR bu cihazda kullanılamıyor. Sayfayı telefondan aç (Android: Chrome, iPhone: Safari).</p>
<section id="qr">
  <canvas id="qc" width="160" height="160"></canvas>
  <div><strong>Telefondan aç</strong><p>Bu kodu telefon kamerasıyla okut.</p><button id="qd">QR kodu indir (PNG)</button></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script type="module">
const DEFAULT = 'nb84-kabin-202.glb';          // ?m= verilmezse açılacak dosya
const f = new URLSearchParams(location.search).get('m') || DEFAULT;
if(!/^[\w\-. ()%]+\.glb$/i.test(f)){ document.getElementById('err').style.display='block'; document.getElementById('mv').remove(); document.getElementById('t').textContent='Hata'; }
else{
  const mv = document.getElementById('mv');
  mv.src = f;
  mv.addEventListener('load', () => { if(!mv.canActivateAR) document.getElementById('noar').hidden = false; });
  document.getElementById('t').textContent = decodeURIComponent(f).replace(/\.glb$/i,'');
  mv.addEventListener('error', () => { document.getElementById('t').textContent='Model açılamadı'; });
}
const qc = document.getElementById('qc'), qd = document.getElementById('qd'), url = location.href;
let qrImg = null;
try{
  if(!window.QRCode) throw new Error('QRCode yok');
  await QRCode.toCanvas(qc, url, {width:160, margin:2});
}catch(e){
  qrImg = new Image(); qrImg.width = 160; qrImg.height = 160; qrImg.alt = 'QR kod'; qrImg.style.background = '#fff'; qrImg.style.borderRadius = '4px';
  qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=' + encodeURIComponent(url);
  qc.replaceWith(qrImg);
}
qd.onclick = () => {
  if(qrImg){ window.open(qrImg.src, '_blank'); return; }
  const a = document.createElement('a'); a.href = qc.toDataURL('image/png'); a.download = 'qr-kod.png'; a.click();
};
</script>
</body>
</html>
